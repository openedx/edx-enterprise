name: Migrations check on mysql8

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: mysql8-migrations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_migrations:
    name: check migrations
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: ['3.12']

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libxmlsec1-dev
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Ubuntu and sql Versions
      run: |
        lsb_release -a
        mysql -V
    - name: Install Python dependencies
      run: |
        uv sync --locked --group dev --no-binary-package mysqlclient --no-binary-package xmlsec
    - name: Initiate Services
      run: |
        sudo /etc/init.d/mysql start
    - name: Reset mysql password
      run: |
        cat <<EOF | mysql -h 127.0.0.1 -u root --password=root
          UPDATE mysql.user SET authentication_string = null WHERE user = 'root';
          FLUSH PRIVILEGES;
        EOF
    - name: Run migrations
      env:
        DB_ENGINE: django.db.backends.mysql
        DB_NAME: enterprise
        DB_USER: root
        DB_PASSWORD:
        DB_HOST: localhost
        DB_PORT: 3306
      run: |
        echo "CREATE DATABASE IF NOT EXISTS enterprise;" | sudo mysql -u root
        echo "Running the migrations."
        uv run --locked python manage.py migrate --settings=enterprise.settings.test
        echo "use mysql; select * from user;" | sudo mysql -u root
